<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Cadastro</title>
  <link rel="stylesheet" href="../css/formulario.css">
</head>
<body>

  <h1>Formulário de Cadastro</h1>

  <form action="#" method="POST">
    <label for="nome">Nome Completo:</label>
    <input type="text" id="nome" name="nome">

    <label for="idade">Idade:</label>
    <input type="number" id="idade" name="idade" min="0">

    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email">

    <label for="tipoSanguineo">Tipo Sanguíneo:</label>
    <select id="tipoSanguineo" name="tipoSanguineo">
      <option value="A+">A+</option>
      <option value="A-">A-</option>
      <option value="B+">B+</option>
      <option value="B-">B-</option>
      <option value="AB+">AB+</option>
      <option value="AB-">AB-</option>
      <option value="O+">O+</option>
      <option value="O-">O-</option>
    </select>

    <label for="medicamento">Medicamento (Nome):</label>
    <input type="text" id="medicamento" name="medicamento">

    <label for="dosagem">Dosagem:</label>
    <input type="text" id="dosagem" name="dosagem">

    <label for="endereco">Local de Moradia:</label>
    <textarea id="endereco" name="endereco" rows="4"></textarea>

   <a href="../pages/home.html"> <button type="submit">Enviar</button></a>
    <a href="../pages/home.html"><button type="submit" id="volt">Voltar</button></a></p>
  </form>

</body>
</html>
