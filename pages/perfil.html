<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cartão de Dados</title>
  <link rel="stylesheet" href="../css/index.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>

</head>
<body>  
  <div class="container">
    <div class="perfil">
      <div class="foto-perfil">
        <span>Foto de Perfil</span>
        <div class="editar"><a href="https://www.google.com.br/?hl=pt-BR" target="blank"><i class="bi bi-camera"></i></a></div>
      </div>
      <div class="nome">
        <input type="text" placeholder="Nome e sobrenome" />
  
      </div>
    </div>
    <div class="botoes">
      <button id="cttsEmergencia">Contatos de emergência</button>
      <div id="myModal" class="modal">
        <div class="modal-content">
          <span class="close">&times;</span>
          <h1>Funcionou</h1>
        </div>
      </div>
      <button>Remédios</button>
      <button>Alergias</button>
      <button>Tipo Sanguíneo</button>
    </div>
  </div>
  <script src="../js/perfil.js"></script>

</html>
